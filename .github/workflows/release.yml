name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS (arm64)
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            app/src-tauri

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Build Tauri app
        working-directory: app
        run: npx tauri build

      - name: Build CLI
        run: cargo build -p unpack-cli --release

      - name: Ad-hoc sign app
        working-directory: target/release/bundle/macos
        run: |
          codesign --force --deep --sign - "Unpack Forge.app"
          codesign --verify --deep --strict "Unpack Forge.app"

      - name: Package app
        working-directory: target/release/bundle/macos
        run: ditto -c -k --keepParent "Unpack Forge.app" "Unpack-Forge-macos-arm64.zip"

      - name: Package CLI
        run: |
          mkdir -p dist/unpack-cli
          cp target/release/unpack dist/unpack-cli/unpack
          cp tools/7zz dist/unpack-cli/7zz
          cp tools/unrar dist/unpack-cli/unrar
          cd dist
          ditto -c -k --keepParent unpack-cli "unpack-cli-macos-arm64.zip"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            target/release/bundle/macos/Unpack-Forge-macos-arm64.zip
            dist/unpack-cli-macos-arm64.zip
